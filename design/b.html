<!DOCTYPE html>
<html lang="en">
<head>
  <title>Milo.Cloud - Design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-weight: 100;
      font-size: 20px;
      color: #777;
      background: #f8f8f8;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: url('imgs/3Elp2.gif') no-repeat center center fixed;
      background-size: cover;
    }

	.logo {
		width: 150px;
		height: auto;
	}

    .logo2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #999;
    }
    
    .are {
      font-size:1.1rem;
      font-weight: 600;
    }

    .container {
      max-width: 550px;
      padding: 100px 0 0 100px;
      margin-bottom: 100px;
      position: relative;
      z-index: 10;
    }

    .header {
      padding: 0 0 50px 2px;
    }

    .header-name {
      font-size: 14px;
    }

    .header-contact {
      font-size: 14px;
    }

    .header-contact a {
      text-decoration: none;
      color: #777;
      transition: color 0.3s ease;
    }

    .header-contact a:hover {
      color: #000;
    }

    .header-subtitle {
      font-size: 10px;
      margin-bottom: 19px;
    }

    .portfolio-item {
      margin-top: 90px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .thumbnail {
      width: 100%;
	  max-width: 550px;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: block;
    }

    .thumbnail:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .item-caption {
      padding: 10px 0 0 2px;
      font-weight: 200;
      color: #797878;
      font-size: 13px;
    }

    /* Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: background-color 0.4s ease, opacity 0.4s ease;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .lightbox.active {
      background-color: rgba(0, 0, 0, 0.9);
      opacity: 1;
      pointer-events: auto;
    }
    
    .lightbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      
      padding: 40px 20px;
    }

    .lightbox-content {
      width: auto;
      max-width: 1200px;
	  padding-top: 60px;
      height: auto;
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .lightbox.active .lightbox-content {
      transform: scale(1);
      opacity: 1;
    }

    .close-lightbox {
      position: fixed;
      top: 20px;
      right: 50px;
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1001;
      font-family: Arial, sans-serif;
    }

    .close-lightbox:hover {
      opacity: 1;
      transform: rotate(90deg);
    }

    /* Animation delays for portfolio items */
    .portfolio-item:nth-child(1) { animation-delay: 0.1s; }
    .portfolio-item:nth-child(2) { animation-delay: 0.2s; }
    .portfolio-item:nth-child(3) { animation-delay: 0.3s; }
    .portfolio-item:nth-child(4) { animation-delay: 0.4s; }
    .portfolio-item:nth-child(5) { animation-delay: 0.5s; }
    .portfolio-item:nth-child(6) { animation-delay: 0.6s; }
    .portfolio-item:nth-child(7) { animation-delay: 0.7s; }
    .portfolio-item:nth-child(8) { animation-delay: 0.8s; }

    /* Three.js Canvas Styles */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* This is critical - canvas shouldn't block scroll */
    }
    
    @media only screen and (max-width: 1400px) {
      .container {
        max-width: 80%;
        margin: 0 auto;
        padding: 100px 0 0 0;
      }
      
      .header {
        padding-bottom: 0;
      }
      
      .lightbox-content {
        max-width: 95%;
      }
      
      .close-lightbox {
        right: 20px; /* Adjust close button position on mobile */
      }
    }

    @media only screen and (max-width: 700px) {
      .logo2 {
        color: #999;
      }
      .header-subtitle {
          color: #777;
          font-size: 12px;
          font-weight: 600;
      }
      .header-contact a {
        color: #777;
        font-size: 16px;
        font-weight: 600;
      }
      .item-caption {
        font-weight: 600;
      }

    }
  </style>
</head>
 
<body>
  <!-- Three.js Canvas -->
  <canvas id="three-canvas"></canvas>
  
  <div class="container">
    <div class="header">
      <div class="logo2">MILO <sup class="are">&reg;</sup></div>
      <div class="header-subtitle">Web Dev. Digital Design. Art Direction.</div>
	  <span class="header-contact"><a href="sms:9096855317">909.685.5317 txt</a></span>
    </div>

    <div class="portfolio-item">
      <img src="imgs/dl_thumb.jpg" class="thumbnail" alt="Mrs Allen Design" data-full="imgs/dl_full.jpg">
      <div class="item-caption">Full Website, Logo Design, Graphic Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/ma_thumb.jpg" class="thumbnail" alt="Mrs Allen Design" data-full="imgs/mrsallen_full.jpg">
      <div class="item-caption">Full Website, Logo Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/nc_thumb.jpg" class="thumbnail" alt="Nurse Courtney Design" data-full="imgs/nursecourtney_full.jpg">
      <div class="item-caption">Full Website, Logo Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/aac_thumb.jpg" class="thumbnail" alt="AAC Design" data-full="imgs/aac_full.jpg">
      <div class="item-caption">Logo Design, Business Card Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/bomani_thumb.jpg" class="thumbnail" alt="Bomani Design" data-full="imgs/bomani_full.jpg">
      <div class="item-caption">Logo Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/axtn_thumb.jpg" class="thumbnail" alt="AXTN Design" data-full="imgs/axtn_full.jpg">
      <div class="item-caption">Logo Design</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/akari_thumb.jpg" class="thumbnail" alt="Akari Product Design" data-full="imgs/akari_full.jpg">
      <div class="item-caption">Product Design, Packaging</div>
    </div>

    <div class="portfolio-item">
      <img src="imgs/Tenkara_thumb.png" class="thumbnail" alt="Tenkara Illustration" data-full="imgs/Tenkara_full.png">
      <div class="item-caption">Digital Art, Illustration</div>
    </div>

    <div class="portfolio-item" style="padding-bottom: 150px;">
      <img src="imgs/Girl_thumb.png" class="thumbnail" alt="Girl Illustration" data-full="imgs/Girl_full.png">
      <div class="item-caption">Digital Art, Illustration</div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox">
    <div class="lightbox-container">
      <img class="lightbox-content" src="" alt="Full size image">
      <div class="close-lightbox">&#215;</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Three.js Scene Setup
      let scene, camera, renderer, heartModel, mixer;
      let scrollY = 0;
      let isModelLoaded = false;

      function initThreeJS() {
        // Scene
        scene = new THREE.Scene();

        // Camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        // Renderer
        const canvas = document.getElementById('three-canvas');
        renderer = new THREE.WebGLRenderer({ 
          canvas: canvas, 
          alpha: true, 
          antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Transparent background

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x888888, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        // Load GLTF Model
        loadHeartModel();

        // Handle window resize
        window.addEventListener('resize', onWindowResize);
      }

      function loadHeartModel() {
        console.log('Creating animated cube...');
        
        // Create a cube with visible faces
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshPhongMaterial({ 
          color: 0xff6b6b, 
          transparent: false, 
          opacity: 1.0,
          shininess: 100,
          wireframe: false
        });
        
        heartModel = new THREE.Mesh(geometry, material);
        heartModel.position.set(0, 0, -10);
        heartModel.scale.set(1, 1, 1);
        scene.add(heartModel);
        isModelLoaded = true;

        console.log('Animated cube added to scene at position:', heartModel.position);
        console.log('Cube scale:', heartModel.scale);
        console.log('Scene children count:', scene.children.length);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function updateScrollEffects() {
        if (!isModelLoaded || !heartModel) return;

        // Simple scroll calculation
        const maxScroll = document.body.scrollHeight - window.innerHeight;
        const scrollProgress = maxScroll > 0 ? scrollY / maxScroll : 0;
        
        // VERY dramatic effects that you can't miss
        if (scrollY > 0) {
          // Move cube MUCH closer when scrolling
          heartModel.position.z = -10 + (scrollProgress * 25); // Moves from -10 to +15
          
          // Change color dramatically
          const hue = scrollProgress;
          heartModel.material.color.setHSL(hue, 1.0, 0.5);
          
          // Make it bigger when scrolling
          const scrollScale = 1 + scrollProgress * 3; // Up to 4x bigger
          heartModel.scale.setScalar(scrollScale);
          
          console.log(`🚀 SCROLL ACTIVE! Progress: ${scrollProgress.toFixed(2)}, Z: ${heartModel.position.z.toFixed(1)}, Scale: ${scrollScale.toFixed(1)}`);
        } else {
          // Reset when at top
          heartModel.position.z = -10;
          heartModel.material.color.setHSL(0, 0.7, 0.5); // Back to red
          console.log('At top of page');
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // Method 4: Manual scroll check every frame (guaranteed to work)
        const frameScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (frameScrollY !== scrollY) {
          console.log(`🎯 Frame scroll check: ${frameScrollY} (was ${scrollY})`);
          scrollY = frameScrollY;
        }

        // Auto animations
        if (heartModel) {
          heartModel.rotation.y += 0.01;
          heartModel.rotation.x += 0.005;
          
          const time = Date.now() * 0.001;
          const pulseScale = 1 + Math.sin(time * 2) * 0.2;
          const baseScale = 1 + Math.sin(time * 0.5) * 0.3;
          
          // Don't let scroll effects override the base animations until we detect scroll
          if (scrollY > 10) {
            // Scroll is detected, apply scroll effects
            updateScrollEffects();
          } else {
            // No scroll, keep auto animations
            heartModel.scale.setScalar(pulseScale * baseScale);
            heartModel.position.y = Math.sin(time * 1.5) * 0.5;
            heartModel.position.x = Math.cos(time * 0.8) * 0.3;
            heartModel.position.z = -10;
            heartModel.material.color.setHSL(0, 0.7, 0.5); // Red
          }
        }

        renderer.render(scene, camera);
      }

      // Scroll detection - let's be very aggressive about this
      let scrollY = 0;
      let lastKnownScrollY = 0;
      
      // Method 1: Standard scroll events
      function handleScroll(source) {
        scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        console.log(`📜 Scroll from ${source}: ${scrollY}`);
        return scrollY;
      }
      
      // Method 2: Multiple event listeners
      window.addEventListener('scroll', () => handleScroll('window'), { passive: true });
      document.addEventListener('scroll', () => handleScroll('document'), { passive: true });
      document.body.addEventListener('scroll', () => handleScroll('body'), { passive: true });
      
      // Method 3: Polling - check scroll every 100ms
      setInterval(() => {
        const currentScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (currentScroll !== lastKnownScrollY) {
          scrollY = currentScroll;
          lastKnownScrollY = currentScroll;
          console.log(`⏰ Polling detected scroll: ${scrollY}`);
        }
      }, 100);

      // Initialize Three.js
      initThreeJS();
      animate();

      // Lightbox functionality
      const lightbox = document.querySelector('.lightbox');
      const lightboxContent = document.querySelector('.lightbox-content');
      const closeLightbox = document.querySelector('.close-lightbox');
      const thumbnails = document.querySelectorAll('.thumbnail');
      
      thumbnails.forEach(thumbnail => {
        thumbnail.addEventListener('click', function() {
          const fullImageSrc = this.getAttribute('data-full');
          const altText = this.getAttribute('alt');
          
          window.scrollTo(0, 0);
          
          lightboxContent.setAttribute('src', fullImageSrc);
          lightboxContent.setAttribute('alt', altText);
          
          setTimeout(() => {
            lightbox.classList.add('active');
            lightbox.scrollTop = 0;
          }, 50);
        });
      });
      
      closeLightbox.addEventListener('click', function() {
        lightbox.classList.remove('active');
        setTimeout(() => {
          lightboxContent.setAttribute('src', '');
        }, 400);
      });
      
      lightbox.addEventListener('click', function(e) {
        if (e.target === this.querySelector('.lightbox-container')) {
          lightbox.classList.remove('active');
          setTimeout(() => {
            lightboxContent.setAttribute('src', '');
          }, 400);
        }
      });
      
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          lightbox.classList.remove('active');
          setTimeout(() => {
            lightboxContent.setAttribute('src', '');
          }, 400);
        }
      });

      // Portfolio animations
      const portfolioItems = document.querySelectorAll('.portfolio-item');
      portfolioItems.forEach((item, index) => {
        item.style.animationDelay = `${0.1 + (index * 0.1)}s`;
      });
    });
  </script>
</body>
</html>
