<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Milo.Cloud</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="stylesheet" href="main.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <style>
            /* Self-hosted display font for the control labels */
            @font-face {
                font-family: 'Black Metal';
                src: url('fonts/Black-Metal.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }
            #button, #nextButton, #backButton {
                font-family: 'Black Metal', cursive;
                font-size: 42px;
                color: #f5f5f5;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
                user-select: none;
                opacity: 0.7;
            }
        </style>
    </head>
<body>
    <div style="padding:25px;"><span id="button" onclick="playAudio()" style="cursor:pointer;">Play</span></div>
    <div style="padding:30px 0 55px 25px;"><span id="nextButton" onclick="playNextAudio()" style="cursor:pointer;">Nxt</span></div>
    <div style="padding:0 0 25px 25px;"><span id="backButton" onclick="playPrevAudio()" style="cursor:pointer;">Prv</span></div>
    

    <script>
        let audioFiles = ["mp3s/SingleThread.mp3", "mp3s/Reignition.mp3", "mp3s/Bad_One.mp3", "mp3s/ClearPathogen.mp3", "mp3s/My_Charger_Is_Broken.mp3", "mp3s/CirclesandSquares.mp3", "mp3s/Slums.mp3", "mp3s/YouAintGotTaLie.mp3", "mp3s/Planks.mp3", "mp3s/Dirt.mp3", "mp3s/What_A_Day.mp3", "mp3s/Looking_Glass.mp3", "mp3s/AscendingOrders.mp3", "mp3s/NoEscape.mp3", "mp3s/Why_The_Grass_Grows.mp3"]; // audio file names
        let bgFiles = ["https://i.gifer.com/8V59.gif", "https://i.gifer.com/6xL.gif", "imgs/stone.gif", "https://i.gifer.com/Pn4.gif", "https://i.gifer.com/yX7.gif", "imgs/bg1.gif", "https://i.gifer.com/YqHO.gif", "https://i.gifer.com/O2A7.gif", "https://i.gifer.com/3ubM.gif", "https://i.gifer.com/4plG.gif", "https://i.gifer.com/8u.gif", "https://i.gifer.com/3SOX.gif", "https://i.gifer.com/cJ5.gif", "https://i.gifer.com/KYaj.gif", "https://i.gifer.com/G1JO.gif"]; // img file names

        let currentAudioIndex = 0;
        let loadedIndex = -1; // which track is currently loaded into the audio element

        let audio = new Audio();

        audio.addEventListener("ended", function(){
            
                playNextAudio();
           
        });

        function playAudio(){
            if(audio.paused){
                // Only load the file when the track actually changes;
                // otherwise resume from the paused position.
                if(loadedIndex !== currentAudioIndex){
                    audio.src = audioFiles[currentAudioIndex];
                    loadedIndex = currentAudioIndex;
                }
                audio.play();
                button.textContent='Pause';
                //$("#nextButton").fadeIn(800);
                //$("#backButton").fadeIn(800);
            } else {
                audio.pause();
                button.textContent='Play';
                //$("#nextButton").fadeOut(800);
                //$("#backButton").fadeOut(800);
            }
            if(audioFiles.length === 0) return alert('No audio files to play.');

        }

        function playNextAudio(){
            if(currentAudioIndex == 14){ currentAudioIndex = 0; }
            else { currentAudioIndex++; }
            audio.src = audioFiles[currentAudioIndex];
            loadedIndex = currentAudioIndex;
            audio.play();
            button.textContent='Pause';
            document.body.style.backgroundImage = "url(" + bgFiles[currentAudioIndex] + ")";
        }
        function playPrevAudio(){
            if(currentAudioIndex == 0){ currentAudioIndex = 14; }
            else { currentAudioIndex--; }
            audio.src = audioFiles[currentAudioIndex];
            loadedIndex = currentAudioIndex;
            audio.play();
            button.textContent='Pause';
            document.body.style.backgroundImage = "url(" + bgFiles[currentAudioIndex] + ")";
        }

        // Toggle play/pause when clicking anywhere on the page,
        // except on the play, next, or prev buttons (they handle their own clicks).
        document.addEventListener("click", function(e){
            if(e.target.closest('#button')) return;
            if(e.target.closest('#nextButton')) return;
            if(e.target.closest('#backButton')) return;
            playAudio();
        });

        // Keyboard shortcuts: Space = play/pause, Left/Right arrows = prev/next.
        document.addEventListener("keydown", function(e){
            if(e.key === " " || e.code === "Space"){
                e.preventDefault(); // stop the page from scrolling on spacebar
                playAudio();
            } else if(e.key === "ArrowLeft"){
                playPrevAudio();
            } else if(e.key === "ArrowRight"){
                playNextAudio();
            }
        });
    </script>
</body>
</html>
